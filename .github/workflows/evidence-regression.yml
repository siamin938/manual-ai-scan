name: Evidence retention and dashboard regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: evidence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture
      PGDATABASE: evidence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Application tests
        run: bun run test
      - name: Edge regression tests
        run: node --test tests/regression/*.node.mjs
      - name: Retention and comparison PostgreSQL regression
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/regression/bootstrap-retention.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260917133219_preserve_measurement_evidence.sql
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/migrations/20260917133440_use_durable_audit_comparison_contracts.sql').read_text()
          Path('/tmp/comparison-rpc.sql').write_text(sql.split('CREATE OR REPLACE FUNCTION public.get_competitor_significance_v02')[0])
          PY
          psql -v ON_ERROR_STOP=1 -f /tmp/comparison-rpc.sql
          psql -v ON_ERROR_STOP=1 -f tests/regression/retention-contracts.sql
      - name: Production build
        run: bun run build
