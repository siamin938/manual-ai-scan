name: Entity Facts Phase 2C Historical Replay

on:
  push:
    branches:
      - codex/p0-entity-truth-phase2c-replay-v2
    paths:
      - ".github/entity-facts-phase2c-replay-trigger"

permissions:
  contents: read

concurrency:
  group: entity-facts-phase2c-historical-replay
  cancel-in-progress: false

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qoirkwmnyolquvsgbian
      ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT: /tmp/entity-facts-phase2c-historical-replay.json

    steps:
      - name: Checkout Phase 2C branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Probe Supabase Management API read-only query
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Historical replay aborted: SUPABASE_ACCESS_TOKEN is not configured." >&2
            exit 2
          fi

          payload="$(jq -nc --arg q 'select 1 as ok' '{query:$q}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")"

          echo "Management API read-only query succeeded."
          echo "$response" | jq -c 'if type=="array" then {type:"array",length:length,first:(.[0] // null)} else {type:type,keys:(keys // [])} end'

      - name: Historical replay execution
        shell: bash
        run: |
          echo "Management API probe only; full replay will run after response contract is confirmed."

      - name: Remove ephemeral replay output
        if: always()
        shell: bash
        run: rm -f /tmp/entity-facts-phase2c-historical-replay.json
