name: Generate observed source migration artifact

on:
  push:
    branches:
      - codex/v2-main-integration
    paths:
      - ".github/workflows/generate-observed-source-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate migration filename with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.113.0 migration new run_observed_source_aggregates_v2
          migration_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_run_observed_source_aggregates_v2.sql' | sort | tail -n 1)"
          test -n "$migration_path"
          cp scripts/sql/run-observed-source-aggregates-v2-migration-candidate.sql "$migration_path"
          printf '%s\n' "$migration_path" > /tmp/observed-source-migration-path.txt
          cat /tmp/observed-source-migration-path.txt

      - name: Commit generated migration and remove generator
        shell: bash
        run: |
          set -euo pipefail
          migration_path="$(cat /tmp/observed-source-migration-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_path"
          git rm .github/workflows/generate-observed-source-migration.yml
          git commit -m "Add observed source aggregate migration"
          git push origin HEAD:codex/v2-main-integration
