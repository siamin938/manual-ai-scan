name: Generate observed source hardening migration

on:
  push:
    branches:
      - codex/v2-main-integration
    paths:
      - ".github/workflows/generate-observed-source-hardening-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate hardening migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.113.0 migration new run_observed_source_aggregates_v2_restrict_service_privileges
          migration_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_run_observed_source_aggregates_v2_restrict_service_privileges.sql' | sort | tail -n 1)"
          test -n "$migration_path"
          cat > "$migration_path" <<'SQL'
          REVOKE REFERENCES, TRIGGER
            ON TABLE public.run_observed_source_aggregates_v2
            FROM service_role;
          SQL
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_path"
          git rm .github/workflows/generate-observed-source-hardening-migration.yml
          git commit -m "Add observed source service privilege hardening migration"
          git push origin HEAD:codex/v2-main-integration
