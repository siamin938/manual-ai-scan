name: Entity Facts v2 Production Backfill (APPROVED 428+23)

on:
  push:
    branches:
      - codex/p0-entity-truth-phase2c-replay-v2
    paths:
      - ".github/entity-facts-v2-production-backfill-trigger"

permissions:
  contents: read

concurrency:
  group: entity-facts-v2-production-backfill
  cancel-in-progress: false

jobs:
  production-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qoirkwmnyolquvsgbian
      ENTITY_FACTS_V2_BACKFILL_PROJECT_REF: qoirkwmnyolquvsgbian
      ENTITY_FACTS_V2_BACKFILL_CONFIRM: BACKFILL_ENTITY_FACTS_V2_428_23

    steps:
      - name: Checkout approved Phase 2C branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Require scoped temporary Supabase token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Production backfill aborted: SUPABASE_ACCESS_TOKEN is not configured." >&2
            exit 2
          fi

      - name: Export exact Production replay dataset read-only
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          export_sql="$(cat scripts/sql/export-entity-facts-phase2c-replay.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"

          http_code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/entity-facts-v2-backfill-export-response.json             --write-out '%{http_code}')"

          if [ "$http_code" != "201" ]; then
            echo "Read-only Production export failed with HTTP ${http_code}." >&2
            jq -c '{
              code: (.code // null),
              message: (.message // .error // null),
              hint: (.hint // null),
              details: (.details // null)
            }' /tmp/entity-facts-v2-backfill-export-response.json >&2 || true
            exit 22
          fi

          jq -e '
            type == "array" and
            length == 1 and
            (.[0].dataset_json | type) == "string"
          ' /tmp/entity-facts-v2-backfill-export-response.json >/dev/null

          jq -r '.[0].dataset_json'             /tmp/entity-facts-v2-backfill-export-response.json             > /tmp/entity-facts-v2-backfill-dataset.json

          jq -e '
            .version == "entity-facts-phase2c-export-v0.1" and
            (.rows | type) == "array" and
            (.rows | length) == 428
          ' /tmp/entity-facts-v2-backfill-dataset.json >/dev/null

          echo "Exact Production export validated at 428 measurements." >> "$GITHUB_STEP_SUMMARY"

      - name: Re-run full materializer dry-run immediately before write
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bun scripts/entity-facts-v2-materialize-dry-run.ts             /tmp/entity-facts-v2-backfill-dataset.json             --expected-runs=23             --expected-measurements=428             --regression-run=28a793c9-c24d-41ff-9037-f08abc21b3ca             --expected-lower=4.17             --expected-upper=29.17             > /tmp/entity-facts-v2-backfill-dry-run.json

          jq -e '
            .runCount == 23 and
            .measurementCount == 428 and
            .validMeasurementCount == 428 and
            .measurementRowCount == 428 and
            .aggregateRowCount == 23 and
            .factVersion == "0.3" and
            .aggregateVersion == "0.1" and
            .contractOk == true and
            .semanticMatch == true and
            .hashChecksOk == true and
            .scopeChecksOk == true and
            .duplicateMeasurementIds == 0 and
            .unresolvedRunCount == 2 and
            .sourcePartialRunCount == 16 and
            .regressionRun.matched == true and
            .regressionRun.visibilityLowerBoundPct == 4.17 and
            .regressionRun.visibilityUpperBoundPct == 29.17
          ' /tmp/entity-facts-v2-backfill-dry-run.json >/dev/null

          echo "Immediate pre-write dry-run passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify v2 tables are empty before write
        shell: bash
        run: |
          set -euo pipefail
          preflight_sql="select
            (select count(*) from public.measurement_entity_facts_v2) as measurement_fact_rows,
            (select count(*) from public.run_entity_fact_aggregates_v2) as aggregate_rows;"
          payload="$(jq -nc --arg q "$preflight_sql" '{query:$q}')"

          http_code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/entity-facts-v2-backfill-preflight.json             --write-out '%{http_code}')"

          [ "$http_code" = "201" ]
          jq -e '
            type == "array" and
            length == 1 and
            (.[0].measurement_fact_rows | tonumber) == 0 and
            (.[0].aggregate_rows | tonumber) == 0
          ' /tmp/entity-facts-v2-backfill-preflight.json >/dev/null

      - name: Execute approved single-transaction Production backfill
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bun scripts/entity-facts-v2-production-backfill-execute.ts             /tmp/entity-facts-v2-backfill-dataset.json             > /tmp/entity-facts-v2-backfill-summary.json

          jq -e '
            .engineVersion == "entity-facts-v2:mef0.3:hist0.1:te0.3:src0.1:agg0.1:mat0.1" and
            .runCount == 23 and
            .measurementCount == 428 and
            .measurementRowCount == 428 and
            .aggregateRowCount == 23 and
            .factVersion == "0.3" and
            .aggregateVersion == "0.1" and
            .preflightMeasurementRows == 0 and
            .preflightAggregateRows == 0 and
            .committedMeasurementRows == 428 and
            .committedAggregateRows == 23 and
            .regressionRun.runId == "28a793c9-c24d-41ff-9037-f08abc21b3ca" and
            .regressionRun.visibilityLowerBoundPct == 4.17 and
            .regressionRun.visibilityUpperBoundPct == 29.17 and
            .temporaryLoginRoleDeleted == true
          ' /tmp/entity-facts-v2-backfill-summary.json >/dev/null

          echo "Approved 428+23 Production backfill transaction committed." >> "$GITHUB_STEP_SUMMARY"
          jq -c '{
            engineVersion,
            runCount,
            measurementCount,
            measurementRowCount,
            aggregateRowCount,
            factVersion,
            aggregateVersion,
            preflightMeasurementRows,
            preflightAggregateRows,
            committedMeasurementRows,
            committedAggregateRows,
            regressionRun,
            temporaryLoginRoleDeleted
          }' /tmp/entity-facts-v2-backfill-summary.json

      - name: Verify committed Production materialization read-only
        shell: bash
        run: |
          set -euo pipefail

          verify_sql="select
            (select count(*) from public.measurement_entity_facts_v2) as measurement_fact_rows,
            (select count(distinct measurement_id) from public.measurement_entity_facts_v2) as distinct_measurement_rows,
            (select count(*) from public.measurement_entity_facts_v2
              where fact_version='0.3'
                and engine_version='entity-facts-v2:mef0.3:hist0.1:te0.3:src0.1:agg0.1:mat0.1') as expected_measurement_rows,
            (select count(*) from public.run_entity_fact_aggregates_v2) as aggregate_rows,
            (select count(distinct source_run_id) from public.run_entity_fact_aggregates_v2) as distinct_run_rows,
            (select count(*) from public.run_entity_fact_aggregates_v2
              where fact_version='0.3'
                and aggregate_version='0.1'
                and engine_version='entity-facts-v2:mef0.3:hist0.1:te0.3:src0.1:agg0.1:mat0.1'
                and contract_ok=true) as expected_aggregate_rows,
            (select (aggregate #>> '{overview,visibilityLowerBoundPct}')::numeric
              from public.run_entity_fact_aggregates_v2
              where source_run_id='28a793c9-c24d-41ff-9037-f08abc21b3ca'::uuid) as regression_lower,
            (select (aggregate #>> '{overview,visibilityUpperBoundPct}')::numeric
              from public.run_entity_fact_aggregates_v2
              where source_run_id='28a793c9-c24d-41ff-9037-f08abc21b3ca'::uuid) as regression_upper;"
          payload="$(jq -nc --arg q "$verify_sql" '{query:$q}')"

          http_code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/entity-facts-v2-backfill-post-verify.json             --write-out '%{http_code}')"

          [ "$http_code" = "201" ]
          jq -e '
            type == "array" and
            length == 1 and
            (.[0].measurement_fact_rows | tonumber) == 428 and
            (.[0].distinct_measurement_rows | tonumber) == 428 and
            (.[0].expected_measurement_rows | tonumber) == 428 and
            (.[0].aggregate_rows | tonumber) == 23 and
            (.[0].distinct_run_rows | tonumber) == 23 and
            (.[0].expected_aggregate_rows | tonumber) == 23 and
            (.[0].regression_lower | tonumber) == 4.17 and
            (.[0].regression_upper | tonumber) == 29.17
          ' /tmp/entity-facts-v2-backfill-post-verify.json >/dev/null

          echo "Post-commit read-only verification passed: 428 facts / 23 aggregates." >> "$GITHUB_STEP_SUMMARY"
          jq -c '.[0]' /tmp/entity-facts-v2-backfill-post-verify.json

      - name: Remove ephemeral backfill data
        if: always()
        shell: bash
        run: |
          rm -f             /tmp/entity-facts-v2-backfill-export-response.json             /tmp/entity-facts-v2-backfill-dataset.json             /tmp/entity-facts-v2-backfill-dry-run.json             /tmp/entity-facts-v2-backfill-preflight.json             /tmp/entity-facts-v2-backfill-summary.json             /tmp/entity-facts-v2-backfill-post-verify.json
