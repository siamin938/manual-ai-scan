project_id = "qoirkwmnyolquvsgbian"

[functions.suggest-questions-router]
verify_jwt = true

[functions.visibility-action-recommendations-v2]
verify_jwt = true

[functions.visibility-diagnostic]
verify_jwt = true

# Browser-facing onboarding endpoint. Platform JWT verification is required,
# and the function body also validates the user token before using service-role RPCs.
[functions.create-organization-with-owner]
verify_jwt = true

# Browser-facing enqueue endpoint. The live runtime currently uses verify_jwt=false
# but the function body validates the user bearer JWT and organization role itself.
[functions.enqueue-run]
verify_jwt = false

# Internal worker endpoint. It authenticates with x-internal-secret instead of a user JWT.
[functions.process-measurement-job]
verify_jwt = false

# Internal guarded scheduler executor. It authenticates with x-internal-secret,
# and DB gates require scheduler_state=running + execution_enabled + executor_ready.
[functions.internal-observation-scheduler-tick]
verify_jwt = false

# Internal/controlled reparse endpoint. The body validates the supplied user JWT and org role.
[functions.reparse-measurements]
verify_jwt = false

# Internal postprocess-only Edge Function. It authenticates with
# x-visibility-postprocess-token instead of a user JWT.
[functions.visibility-postprocess]
verify_jwt = false

# Internal citation synchronization endpoint. It authenticates with
# x-visibility-postprocess-token instead of a user JWT.
[functions.visibility-citation-sync]
verify_jwt = false

# Internal postprocess-only Edge Function. It authenticates with
# x-visibility-postprocess-token instead of a user JWT.
[functions.visibility-citation-attribution]
verify_jwt = false

# Internal Entity Facts v2 materialization worker. It authenticates with
# x-visibility-postprocess-token and performs no paid provider call.
[functions.entity-facts-v2-materialize-run]
verify_jwt = false

# Browser-facing benchmark endpoint. Platform JWT is required and the body also
# validates the user and organization membership before service-role reads.
[functions.visibility-benchmark]
verify_jwt = true

# Browser-facing internal discovery preview. Platform JWT is required and the
# function body validates the user plus internal-observation organization role.
# Read-only: no business/pipeline/run/job/credit mutation.
[functions.internal-observation-discovery-preview]
verify_jwt = true

# v0.9.4 recurring discovery worker. Manual runs authenticate a user bearer JWT;
# scheduled runs authenticate with x-internal-secret. The body validates the
# internal-observation organization and configured actor. No measurement side effects.
[functions.internal-observation-discovery-batch]
verify_jwt = false
