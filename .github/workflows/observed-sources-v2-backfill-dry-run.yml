name: Observed Sources v2 Backfill Dry Run

on:
  push:
    branches:
      - codex/v2-main-integration
    paths:
      - ".github/workflows/observed-sources-v2-backfill-dry-run.yml"
      - "scripts/observed-sources-v2-backfill-dry-run.ts"
      - "scripts/sql/export-observed-sources-v2-backfill-replay.sql"
      - "scripts/sql/export-observed-source-v2-backfill-base.sql"
      - "supabase/functions/_shared/entity-engine-v2/run-observed-sources.ts"
      - "supabase/functions/_shared/entity-engine-v2/run-entity-facts-observed-sources.candidate.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observed-sources-v2-backfill-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qoirkwmnyolquvsgbian

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Export scoped historical replay dataset read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

          export_sql="$(cat scripts/sql/export-observed-sources-v2-backfill-replay.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"

          http_code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/observed-replay-response.json             --write-out '%{http_code}')"

          test "$http_code" = "201"
          jq -e 'type=="array" and length==1 and (.[0].dataset_json|type)=="string"'             /tmp/observed-replay-response.json >/dev/null
          jq -r '.[0].dataset_json' /tmp/observed-replay-response.json             > /tmp/observed-replay-dataset.json
          jq -e '.version=="entity-facts-phase2c-export-v0.1" and (.rows|length)==428'             /tmp/observed-replay-dataset.json >/dev/null

      - name: Export immutable base aggregates read-only
        shell: bash
        run: |
          set -euo pipefail

          export_sql="$(cat scripts/sql/export-observed-source-v2-backfill-base.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"

          http_code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/observed-base-response.json             --write-out '%{http_code}')"

          test "$http_code" = "201"
          jq -e 'type=="array" and length==1 and (.[0].base_json|type)=="string"'             /tmp/observed-base-response.json >/dev/null
          jq -r '.[0].base_json' /tmp/observed-base-response.json             > /tmp/observed-base.json
          jq -e '.version=="observed-source-v2-backfill-base-v0.1" and (.rows|length)==23'             /tmp/observed-base.json >/dev/null

      - name: Run Production historical dry-run
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/observed-sources-v2-backfill-dry-run.ts             /tmp/observed-replay-dataset.json             /tmp/observed-base.json             > /tmp/observed-sources-v2-backfill-dry-run-summary.json

          jq -e '
            .runCount == 23 and
            .supplementRowCount == 23 and
            .runsWithObservedSources == 17 and
            .observedSourceDomainCount == 94 and
            .observedTargetSourceDomainCount == 14 and
            .observedCompetitorSourceDomainCount == 81 and
            .sourceLinkedCompetitorCount == 116 and
            .allCandidateContractsOk == true and
            .allHashesOk == true
          ' /tmp/observed-sources-v2-backfill-dry-run-summary.json >/dev/null

          cat /tmp/observed-sources-v2-backfill-dry-run-summary.json
          echo "Observed Sources v2 Production historical dry-run passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary only
        uses: actions/upload-artifact@v4
        with:
          name: observed-sources-v2-backfill-dry-run-summary
          path: /tmp/observed-sources-v2-backfill-dry-run-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit non-sensitive dry-run summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/reports
          cp /tmp/observed-sources-v2-backfill-dry-run-summary.json             scripts/reports/observed-sources-v2-backfill-dry-run-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reports/observed-sources-v2-backfill-dry-run-summary.json
          if git diff --cached --quiet; then
            echo "Summary unchanged."
          else
            git commit -m "Record observed source Production dry-run summary"
            git push origin HEAD:codex/v2-main-integration
          fi

      - name: Remove ephemeral sensitive exports
        if: always()
        shell: bash
        run: |
          rm -f             /tmp/observed-replay-response.json             /tmp/observed-replay-dataset.json             /tmp/observed-base-response.json             /tmp/observed-base.json
