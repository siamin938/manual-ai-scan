name: Recover live Edge sources

on:
  push:
    branches:
      - chore/entity-engine-v2-foundation
    paths:
      - ".github/workflows/recover-live-edge-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/chore/entity-engine-v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qoirkwmnyolquvsgbian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check recovery credential
        id: credential
        shell: bash
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Supabase recovery credential is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase recovery credential is not configured in this repository."
          fi

      - name: Download exact deployed sources
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          mkdir -p .recovery
          cd .recovery
          npx --yes supabase@latest init
          npx --yes supabase@latest functions download process-measurement-job --project-ref "$PROJECT_REF" --use-api
          npx --yes supabase@latest functions download reparse-measurements --project-ref "$PROJECT_REF" --use-api
          npx --yes supabase@latest functions download visibility-postprocess --project-ref "$PROJECT_REF" --use-api
          find supabase/functions -type f -print | sort

      - name: Upload recovery artifact
        if: steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-edge-source-recovery
          path: .recovery/supabase/functions
          if-no-files-found: error
          retention-days: 1
