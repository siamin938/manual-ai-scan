name: Entity Facts v2 Production Preflight (NO INSERT)

on:
  push:
    branches:
      - codex/p0-entity-truth-phase2c-replay-v2
    paths:
      - ".github/entity-facts-v2-production-preflight-trigger"

permissions:
  contents: read

concurrency:
  group: entity-facts-v2-production-preflight
  cancel-in-progress: false

jobs:
  production-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout Phase 2C branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Require scoped temporary Supabase token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Production preflight aborted: SUPABASE_ACCESS_TOKEN is not configured." >&2
            exit 2
          fi

      - name: Run no-insert Production preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bun scripts/entity-facts-v2-production-preflight.ts             > /tmp/entity-facts-v2-production-preflight.json

          jq -e '
            .projectRef == "qoirkwmnyolquvsgbian" and
            (.sessionUser | startswith("cli_login_postgres")) and
            .currentUser == "service_role" and
            .measurementFactRows == 0 and
            .aggregateRows == 0 and
            .facts.select == true and
            .facts.insert == true and
            .facts.update == false and
            .facts.delete == false and
            .facts.truncate == false and
            .facts.rls == true and
            .facts.forceRls == true and
            .aggregates.select == true and
            .aggregates.insert == true and
            .aggregates.update == false and
            .aggregates.delete == false and
            .aggregates.truncate == false and
            .aggregates.rls == true and
            .aggregates.forceRls == true and
            .triggers.measurementScope == true and
            .triggers.measurementImmutable == true and
            .triggers.aggregateMaterialization == true and
            .triggers.aggregateImmutable == true and
            .temporaryLoginRoleDeleted == true
          ' /tmp/entity-facts-v2-production-preflight.json >/dev/null

          echo "Entity Facts v2 Production preflight passed." >> "$GITHUB_STEP_SUMMARY"
          jq -c '{
            projectRef,
            sessionUser,
            currentUser,
            measurementFactRows,
            aggregateRows,
            facts,
            aggregates,
            triggers,
            temporaryLoginRoleDeleted
          }' /tmp/entity-facts-v2-production-preflight.json

      - name: Remove ephemeral preflight output
        if: always()
        shell: bash
        run: rm -f /tmp/entity-facts-v2-production-preflight.json
