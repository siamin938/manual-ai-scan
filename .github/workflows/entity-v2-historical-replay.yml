name: Entity v2 Historical Replay

on:
  push:
    branches:
      - chore/entity-engine-v2-foundation
    paths:
      - ".github/workflows/entity-v2-historical-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-presence-probe:
    if: github.ref == 'refs/heads/chore/entity-engine-v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROBE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PROBE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROBE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROBE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check existing server credential names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "${label}=PRESENT"
            else
              echo "${label}=ABSENT"
            fi
          }
          probe "SUPABASE_SERVICE_ROLE_KEY" "${PROBE_SERVICE_ROLE_KEY:-}"
          probe "SUPABASE_SECRET_KEY" "${PROBE_SECRET_KEY:-}"
          probe "SUPABASE_DB_URL" "${PROBE_DB_URL:-}"
          probe "DATABASE_URL" "${PROBE_DATABASE_URL:-}"
          probe "SUPABASE_ACCESS_TOKEN" "${PROBE_ACCESS_TOKEN:-}"
          echo "No credential values were printed or used for data access."
