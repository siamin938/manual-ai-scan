name: Validate source clue gateway UI

on:
  push:
    branches:
      - codex/v2-main-integration
    paths:
      - ".github/workflows/validate-source-clue-ui.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Entity Engine tests
        run: bun run test -- tests/entity-engine-v2
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Record validation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/reports
          cat > scripts/reports/source-clue-ui-validation.json <<JSON
          {
            "version": "source-clue-ui-validation-v0.1",
            "validatedCommit": "$(git rev-parse HEAD)",
            "tests": "passed",
            "typecheck": "passed",
            "build": "passed",
            "productionPublished": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reports/source-clue-ui-validation.json
          git rm .github/workflows/validate-source-clue-ui.yml
          git commit -m "Record source clue UI validation"
          git push origin HEAD:codex/v2-main-integration
