name: Entity Facts Phase 2C Historical Replay

on:
  push:
    branches:
      - codex/p0-entity-truth-phase2c-replay-v2
    paths:
      - ".github/entity-facts-phase2c-replay-trigger"

permissions:
  contents: read

concurrency:
  group: entity-facts-phase2c-historical-replay
  cancel-in-progress: false

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qoirkwmnyolquvsgbian
      ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT: /tmp/entity-facts-phase2c-historical-replay.json
      ENTITY_FACTS_V2_DRY_RUN_SUMMARY: /tmp/entity-facts-v2-materializer-dry-run-summary.json

    steps:
      - name: Checkout Phase 2C branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Export Phase 2C replay dataset via Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Historical replay aborted: SUPABASE_ACCESS_TOKEN is not configured." >&2
            exit 2
          fi

          export_sql="$(cat scripts/sql/export-entity-facts-phase2c-replay.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"

          umask 077
          http_code="$(curl --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            --output /tmp/entity-facts-phase2c-export-response.json \
            --write-out '%{http_code}')"

          if [ "$http_code" != "201" ]; then
            echo "Read-only historical export failed with HTTP ${http_code}." >&2
            jq -c '{
              code: (.code // null),
              message: (.message // .error // null),
              hint: (.hint // null),
              details: (.details // null)
            }' /tmp/entity-facts-phase2c-export-response.json >&2 || true
            exit 22
          fi

          jq -e '
            type == "array" and
            length == 1 and
            (.[0].dataset_json | type) == "string"
          ' /tmp/entity-facts-phase2c-export-response.json >/dev/null

          jq -r '.[0].dataset_json' \
            /tmp/entity-facts-phase2c-export-response.json \
            > /tmp/entity-facts-phase2c-dataset.json

          jq -e '
            .version == "entity-facts-phase2c-export-v0.1" and
            (.rows | type) == "array" and
            (.rows | length) > 0
          ' /tmp/entity-facts-phase2c-dataset.json >/dev/null

          row_count="$(jq '.rows | length' /tmp/entity-facts-phase2c-dataset.json)"
          echo "Phase 2C historical export completed: ${row_count} measurements." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Phase 2C historical replay
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bun scripts/entity-facts-phase2c-replay.ts \
            /tmp/entity-facts-phase2c-dataset.json \
            > "${ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT}"

          jq -c '{
            summary: .summary,
            releaseGate: .releaseGate,
            runs: [.runs[] | {
              runId,
              businessId,
              businessName,
              currentVisibilityPct: .current.visibilityRatePct,
              proposedVisibilityLowerPct: .proposed.visibilityLowerBoundPct,
              proposedVisibilityUpperPct: .proposed.visibilityUpperBoundPct,
              currentTop3Pct: .current.top3RatePct,
              proposedTop3LowerPct: .proposed.top3LowerBoundPct,
              proposedTop3UpperPct: .proposed.top3UpperBoundPct,
              confirmedMentionCount: .proposed.confirmedMentionCount,
              unresolvedTargetCount: .proposed.unresolvedTargetCount,
              competitorCount: .proposed.competitorCount,
              sourceDomainCount: .proposed.sourceDomainCount,
              sourcePartialMeasurementCount: .proposed.sourcePartialMeasurementCount,
              competitorAdded,
              competitorRemoved,
              targetSourceAdded,
              targetSourceRemoved,
              contractOk
            }]
          }' "${ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT}" \
            > /tmp/entity-facts-phase2c-log-summary.json

          echo "Replay summary:"
          cat /tmp/entity-facts-phase2c-log-summary.json

      - name: Validate Entity Facts v2 materializer dry-run
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bun scripts/entity-facts-v2-materialize-dry-run.ts \
            /tmp/entity-facts-phase2c-dataset.json \
            --expected-runs=23 \
            --expected-measurements=428 \
            --regression-run=28a793c9-c24d-41ff-9037-f08abc21b3ca \
            --expected-lower=4.17 \
            --expected-upper=29.17 \
            > "${ENTITY_FACTS_V2_DRY_RUN_SUMMARY}"

          jq -e '
            .runCount == 23 and
            .measurementCount == 428 and
            .measurementRowCount == 428 and
            .aggregateRowCount == 23 and
            .factVersion == "0.3" and
            .aggregateVersion == "0.1" and
            .contractOk == true and
            .semanticMatch == true and
            .hashChecksOk == true and
            .scopeChecksOk == true and
            .duplicateMeasurementIds == 0 and
            .unresolvedRunCount == 2 and
            .sourcePartialRunCount == 16 and
            .regressionRun.matched == true and
            .regressionRun.visibilityLowerBoundPct == 4.17 and
            .regressionRun.visibilityUpperBoundPct == 29.17
          ' "${ENTITY_FACTS_V2_DRY_RUN_SUMMARY}" >/dev/null

          echo "Materializer dry-run summary:"
          cat "${ENTITY_FACTS_V2_DRY_RUN_SUMMARY}"
          echo "Entity Facts v2 materializer dry-run passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review-only replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-facts-phase2c-historical-replay-review
          path: |
            /tmp/entity-facts-phase2c-historical-replay.json
            /tmp/entity-facts-v2-materializer-dry-run-summary.json
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce Phase 2C release gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.releaseGate.ok == true' \
            "${ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT}" >/dev/null || {
              echo "Phase 2C release gate is BLOCKED." >&2
              jq -c '.releaseGate' "${ENTITY_FACTS_PHASE2C_REPLAY_OUTPUT}" >&2
              exit 1
            }

      - name: Remove ephemeral replay data
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/entity-facts-phase2c-export-response.json \
            /tmp/entity-facts-phase2c-dataset.json \
            /tmp/entity-facts-phase2c-log-summary.json \
            /tmp/entity-facts-phase2c-historical-replay.json \
            /tmp/entity-facts-v2-materializer-dry-run-summary.json
