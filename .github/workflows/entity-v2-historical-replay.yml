name: Entity v2 Historical Replay

on:
  push:
    branches:
      - chore/entity-engine-v2-foundation
    paths:
      - ".github/workflows/entity-v2-historical-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anon-read-probe:
    if: github.ref == 'refs/heads/chore/entity-engine-v2-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://qoirkwmnyolquvsgbian.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_fxViuypL9uYIdjLqu9AVdw_U79pz_cR
    steps:
      - name: Probe RLS-protected measurement read without exposing content
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/measurements?select=id&limit=1")"
          echo "HTTP status: ${status}"
          if [ "${status}" != "200" ]; then
            echo "Anon read is unavailable."
            exit 0
          fi
          rows="$(jq 'length' "$response_file")"
          echo "Rows visible to anon: ${rows}"
          if [ "${rows}" -gt 0 ]; then
            echo "ANON_HISTORICAL_REPLAY_POSSIBLE=true"
          else
            echo "ANON_HISTORICAL_REPLAY_POSSIBLE=false"
          fi
