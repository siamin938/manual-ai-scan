name: Entity Engine v2

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/entity-engine-v2/**"
      - "supabase/functions/process-measurement-job/**"
      - "supabase/functions/reparse-measurements/**"
      - "supabase/EDGE_RUNTIME_CONTRACT.json"
      - "supabase/migrations/*entity_facts_v2*.sql"
      - "tests/entity-engine-v2/**"
      - "src/lib/entity-facts-v2-read-gateway.*"
      - "src/routes/_authenticated/dashboard.tsx"
      - "tests/fixtures/entity-golden-corpus*.json"
      - "tests/fixtures/entity-v2-shadow-*.json"
      - "scripts/entity-v2-shadow-replay.ts"
      - "scripts/entity-facts-phase2c-replay.ts"
      - "scripts/entity-facts-v2-materialize.ts"
      - "scripts/entity-facts-v2-materialize-dry-run.ts"
      - "scripts/observed-sources-v2-backfill-dry-run.ts"
      - "scripts/entity-facts-v2-production-backfill.ts"
      - ".github/workflows/entity-facts-v2-production-backfill.yml"
      - "scripts/entity-facts-v2-production-backfill-execute.ts"
      - "scripts/entity-facts-v2-production-preflight.ts"
      - "scripts/entity-facts-v2-read-gateway-smoke.ts"
      - ".github/workflows/entity-facts-v2-production-preflight.yml"
      - "scripts/sql/export-entity-v2-replay.sql"
      - "scripts/sql/export-entity-facts-phase2c-replay.sql"
      - "scripts/sql/export-observed-source-v2-backfill-base.sql"
      - "scripts/sql/run-observed-source-aggregates-v2-migration-candidate.sql"
      - ".github/workflows/entity-engine-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entity-engine-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Entity Engine v2 tests
        run: bun run test -- tests/entity-engine-v2

      - name: Build dashboard cutover
        run: bun run build


  observed-sources-production-dry-run:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/v2-main-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qoirkwmnyolquvsgbian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export observed-source replay dataset read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          export_sql="$(cat scripts/sql/export-observed-sources-v2-backfill-replay.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"
          code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/replay-response.json             --write-out '%{http_code}')"
          test "$code" = "201"
          jq -e 'type=="array" and length==1 and (.[0].dataset_json|type)=="string"' /tmp/replay-response.json >/dev/null
          jq -r '.[0].dataset_json' /tmp/replay-response.json > /tmp/replay.json
          jq -e '.version=="entity-facts-phase2c-export-v0.1" and (.rows|length)==428' /tmp/replay.json >/dev/null

      - name: Export observed-source base aggregates read-only
        shell: bash
        run: |
          set -euo pipefail
          export_sql="$(cat scripts/sql/export-observed-source-v2-backfill-base.sql)"
          payload="$(jq -nc --arg q "$export_sql" '{query:$q}')"
          code="$(curl --silent --show-error             -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query/read-only"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data "$payload"             --output /tmp/base-response.json             --write-out '%{http_code}')"
          test "$code" = "201"
          jq -e 'type=="array" and length==1 and (.[0].base_json|type)=="string"' /tmp/base-response.json >/dev/null
          jq -r '.[0].base_json' /tmp/base-response.json > /tmp/base.json
          jq -e '.version=="observed-source-v2-backfill-base-v0.1" and (.rows|length)==23' /tmp/base.json >/dev/null

      - name: Run observed-source Production dry-run
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/observed-sources-v2-backfill-dry-run.ts             /tmp/replay.json             /tmp/base.json             > /tmp/summary.json
          jq -e '
            .runCount == 23 and
            .supplementRowCount == 23 and
            .runsWithObservedSources == 17 and
            .observedSourceDomainCount == 94 and
            .observedTargetSourceDomainCount == 14 and
            .observedCompetitorSourceDomainCount == 81 and
            .sourceLinkedCompetitorCount == 116 and
            .allCandidateContractsOk == true and
            .allHashesOk == true
          ' /tmp/summary.json >/dev/null
          cat /tmp/summary.json

      - name: Remove ephemeral Production exports
        if: always()
        run: rm -f /tmp/replay-response.json /tmp/replay.json /tmp/base-response.json /tmp/base.json /tmp/summary.json
